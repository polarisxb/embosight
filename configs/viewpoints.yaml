# ============================================================
# 离散视角库（5 个 robosuite 内置摄像头）
# ============================================================
# 校赛 Day 2: 用 robosuite 内置摄像头名代替自定义位姿
# "切换视角" = "切换摄像头"，无需 IK / 机械臂运动
# position / orientation 仅作语义参考，实际由 robosuite 控制
# ============================================================

viewpoints:
  - name: agentview
    position: [0, 0, 60]
    orientation: [0, -45, 0]
    purpose: "全景前视，用于场景概览"

  - name: birdview
    position: [0, 0, 100]
    orientation: [0, -90, 0]
    purpose: "顶视图，用于俯瞰布局"

  - name: sideview
    position: [60, 0, 30]
    orientation: [0, -30, -90]
    purpose: "侧视图，用于深度判断"

  - name: frontview
    position: [0, -60, 30]
    orientation: [0, -30, 0]
    purpose: "正面视图，用于近距识别"

  - name: robot0_eye_in_hand
    position: [0, 0, 30]
    orientation: [0, -90, 0]
    purpose: "机械臂末端视角，用于物体特写"