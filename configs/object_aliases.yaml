# 中文/英文用户目标名 → RoboCasa body name 候选列表
# RoboCasa 每次 reset 随机分配物品种类, body name 格式: obj_main / distr_counter_*_main
# 运行 print(env._env.sim.model.body_names) 后按需补全
aliases:
  # === 容器/瓶罐 ===
  # 注意: obj_main 不应出现在 alias 中, 它是 RoboCasa 任务随机生成的物体,
  # 类型不确定. 让 alias_map 只做真正的语义匹配, obj_main 由 fallback 路径处理.
  药瓶: [bottle, medicine_bottle, pill_bottle, medicine, pill, drug]
  瓶子: [bottle, jar, container]
  水瓶: [water_bottle, bottle]
  调味瓶: [seasoning_bottle, spice_bottle, bottle, condiment]
  啤酒: [beer, bottle]
  饮料: [drink, bottle, soda, juice]
  酱油: [soy_sauce, sauce, bottle]
  醋: [vinegar, bottle]
  油: [oil, bottle]
  罐头: [can, tin, jar]
  罐子: [jar, can, container]

  # === 杯具 ===
  杯子: [cup, mug, glass, tumbler]
  马克杯: [mug, cup]
  水杯: [glass, cup, tumbler, water_glass]
  咖啡杯: [coffee_cup, mug, cup]
  茶杯: [tea_cup, cup, mug]
  酒杯: [wine_glass, glass]

  # === 锅具/烹饪 ===
