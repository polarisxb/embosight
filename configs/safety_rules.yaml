# SafeQuery-VLM 安全规则配置
# RoboCasa 物体类别 → 风险等级 + 中文名 + 说明
# risk_level: safe / fragile / hot / sharp / high
# high = 视障场景下绝对危险 (例如锐器、开刃刀)
# hot  = 可能温热 (锅/壶)
# sharp = 有刃/尖角但一般场景安全 (削皮器)
# fragile = 易碎 (玻璃/陶瓷)
# safe = 无明显风险

categories:
  # 工具类
  peeler:
    risk_level: sharp
    zh_name: 削皮器
    reason: 刀片锋利, 握持时避免手部滑入刀口
  reamer:
    risk_level: safe
    zh_name: 榨汁器
    reason: 手动工具, 一般无风险
  knife:
    risk_level: high
    zh_name: 刀
    reason: 开刃刀具, 视障场景需人工确认
  scissors:
    risk_level: high
    zh_name: 剪刀
    reason: 尖锐刀具, 视障场景需人工确认
  whisk:
    risk_level: safe
    zh_name: 打蛋器
    reason: 手动工具, 一般无风险
  spatula:
    risk_level: safe
    zh_name: 铲子
    reason: 烹饪工具, 一般无风险
  opener:
    risk_level: sharp
    zh_name: 开瓶器
    reason: 有金属尖端, 小心划伤

  # 容器类
  cup:
    risk_level: fragile
    zh_name: 杯子
    reason: 常为陶瓷或玻璃, 轻拿轻放
  mug:
    risk_level: fragile
    zh_name: 马克杯
    reason: 陶瓷易碎, 轻拿轻放
  glass:
    risk_level: fragile
    zh_name: 玻璃杯
    reason: 玻璃易碎且碎片锋利
  bowl:
    risk_level: fragile
    zh_name: 碗
    reason: 陶瓷易碎, 轻拿轻放
  plate:
    risk_level: fragile
    zh_name: 盘子
    reason: 陶瓷易碎, 轻拿轻放

  # 瓶类
  bottle:
    risk_level: safe
    zh_name: 瓶子
    reason: 一般塑料或玻璃材质
  condiment_bottle:
    risk_level: safe
    zh_name: 调味瓶
    reason: 装调味品, 一般塑料或玻璃
  water_bottle:
    risk_level: safe
    zh_name: 水瓶
    reason: 塑料材质, 无风险
  medicine_bottle:
    risk_level: safe
    zh_name: 药瓶
    reason: 塑料材质, 注意勿误食药物
  jar:
    risk_level: safe
    zh_name: 罐子
    reason: 一般无风险
  can:
    risk_level: safe
    zh_name: 罐头
    reason: 注意罐口可能有锋利边缘

  # 食物类
  apple:
    risk_level: safe
    zh_name: 苹果
    reason: 水果, 无风险
  banana:
    risk_level: safe
    zh_name: 香蕉
    reason: 水果, 无风险
  orange:
    risk_level: safe
    zh_name: 橙子
    reason: 水果, 无风险
  bread:
    risk_level: safe
    zh_name: 面包
    reason: 食物, 无风险
  egg:
    risk_level: fragile
    zh_name: 鸡蛋
    reason: 易碎, 请轻拿
  tomato:
    risk_level: safe
    zh_name: 番茄
    reason: 蔬菜, 无风险
  potato:
    risk_level: safe
    zh_name: 土豆
    reason: 蔬菜, 无风险
  carrot:
    risk_level: safe
    zh_name: 胡萝卜
    reason: 蔬菜, 无风险
  lemon:
    risk_level: safe
    zh_name: 柠檬
    reason: 水果, 无风险

  # 烹饪类 (可能高温)
  pot:
    risk_level: hot
    zh_name: 锅
    reason: 可能温热, 请用手背先试温
  pan:
    risk_level: hot
    zh_name: 平底锅
    reason: 可能温热, 小心烫伤
  kettle:
    risk_level: hot
    zh_name: 水壶
    reason: 可能内有热水, 小心烫伤
  teapot:
    risk_level: hot
    zh_name: 茶壶
    reason: 可能内有热水

  # Fallback (未匹配类别)
  _default:
    risk_level: unknown
    zh_name: 未知物体
    reason: 建议您手动确认后再操作

# 门控阈值
gates:
  # 一般执行门槛
  min_confidence: 0.75

  # 高风险类别需更高置信度才执行
  high_risk_min_confidence: 0.90
  high_risk_categories: [high, hot, sharp]

  # 绝对拒绝类别 (即使 conf=1.0 也不执行)
  never_execute_categories: []
