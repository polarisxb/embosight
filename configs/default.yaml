# ============================================================
# EmboSight 默认配置
# ============================================================

project:
  name: EmboSight
  version: "0.1.0"
  description: "零样本视障具身辅助智能体"

# LLM 后端 (DeepSeek API)
llm:
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  max_tokens: 2048
  temperature: 0.1
  timeout: 60.0

# VLM 后端 (Qwen2.5-VL-7B)
vlm:
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "cuda"
  torch_dtype: "bfloat16"
  max_new_tokens: 1024
  cache_dir: "./checkpoints"

# 视角库
viewpoints_path: "configs/viewpoints.yaml"

# 主动规划器
active_planner:
  max_viewpoints: 6
  coverage_threshold: 0.85
  prompt_path: "prompts/active_planner.txt"

# Prompt 路径
prompts:
  task_decompose: "prompts/task_decompose.txt"
  active_planner: "prompts/active_planner.txt"
  scene_describer: "prompts/scene_describer.txt"

# 仿真环境
simulator:
  type: "robocasa"
  env_name: "PickPlaceCounterToCabinet"
  robots: "PandaMobile"
  image_width: 256
  image_height: 256
  camera_names:
    - robot0_agentview_center
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_frontview
    - robot0_robotview
    - robot0_eye_in_hand

# 输出目录
output:
  results_dir: "./results"
  video_dir: "./results/videos"
  observation_dir: "./results/observations"
  log_dir: "./logs"

# 日志
logging:
  level: "INFO"
  log_file: "logs/embosight.log"